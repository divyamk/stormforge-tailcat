plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '0.1.3-forge-1.20.1'
group = 'com.tailscale.mclink'
base { archivesName = 'tailcat-for-minecraft' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'; testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4' }
test { useJUnitPlatform() }
jar.finalizedBy('reobfJar')

sourceSets.main.resources {
    srcDir '../mod/src/main/resources'
    exclude 'fabric.mod.json', 'mclink.mixins.json'
}
